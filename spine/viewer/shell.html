<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spine Views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen viewer. View picker and display options on the left, the 800 x 800 frame on the right.
   Single dark world on purpose: sprites are judged against a neutral, unlit workspace. */
:root {
  --bg: #15181c; --panel: #1d2126; --raise: #272c33; --line: #333941;
  --ink: #e7e2d6; --muted: #8f969e; --accent: #7cc4d8; --accent-ink: #0e1a1f;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 13px; line-height: 1.4; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-columns: 270px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-family: var(--f-display); font-size: 22px; font-weight: 600; margin: 0; }
header small { color: var(--muted); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.rail { grid-row: 2 / 4; overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
.group { padding: 12px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.group h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
#views { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
#views button { border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 7px 6px; cursor: pointer; text-align: left; }
#views button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 6px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }
.legend { display: grid; gap: 3px; margin: 2px 0 0 22px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.hint { margin: 0; color: var(--muted); font-size: 12px; }
#stage { position: relative; overflow: auto; padding: 20px; min-height: 0; }
.frame { position: relative; display: inline-block; border: 1px solid var(--line); }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#lbl-layer { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; font-family: var(--f-mono); font-size: 11px; color: var(--muted); transform: translateY(-50%); white-space: nowrap; }
.lbl.l { transform: translate(-100%, -50%); }
#caption { color: var(--muted); font-size: 12px; margin-top: 8px; }
#busy { position: absolute; top: 12px; right: 16px; background: var(--raise); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--accent); }
.statusbar { border-top: 1px solid var(--line); background: var(--panel); padding: 7px 16px; min-height: 34px; }
#status { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(70vh, 1fr) auto; height: auto; } .rail { grid-row: auto; border-right: 0; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Spine Views</h1><small>Adult female, 183 cm · C1–L5, sacrum, coccyx and 23 discs · pixel art rendered from code</small>
    <div class="spacer"></div>
    <button class="btn" type="button" id="save">Save PNG (1 px = 1 mm)</button>
  </header>
  <aside class="rail" aria-label="Controls">
    <section class="group"><h2>View</h2><div id="views" role="group" aria-label="Camera angle"></div>
      <p class="hint">Eight fixed eye-level angles around one pivot. A vertebra sits at the same screen height in every view.</p></section>
    <section class="group"><h2>Zoom</h2><div class="seg" id="zoom" role="group" aria-label="Zoom"></div>
      <h2>Background</h2><div class="seg" id="bg" role="group" aria-label="Background"></div></section>
    <section class="group"><h2>Overlays</h2>
      <label class="check" for="labels"><input type="checkbox" id="labels"> Vertebra labels</label>
      <label class="check" for="guides"><input type="checkbox" id="guides"> Pivot guides</label>
      <label class="check" for="regions"><input type="checkbox" id="regions"> Colour by region</label>
      <div class="legend"><span><i style="background:#d9a441"></i>Cervical</span><span><i style="background:#5aa6c9"></i>Thoracic</span><span><i style="background:#8b7fd1"></i>Lumbar</span><span><i style="background:#5fb38a"></i>Sacrum</span><span><i style="background:#d9708a"></i>Coccyx</span></div>
    </section>
  </aside>
  <main id="stage"><div id="busy" hidden></div>
    <div class="frame"><canvas id="cv" width="800" height="800"></canvas><div id="lbl-layer"></div></div>
    <div id="caption"></div>
  </main>
  <div class="statusbar"><div id="status"></div></div>
</div>
<script id="core-src">
/*CORE*/
</script>
<script id="render-src">
/*RENDER*/
</script>
<script>
/*VIEWER*/
</script>
</body>
</html>
